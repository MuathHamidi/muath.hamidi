<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeIn₃ AiiDA QE Output Explorer</title>
    <style>
        :root {
            --bg-base: #0f1115;
            --bg-panel: #1a1d24;
            --bg-panel-hover: #232730;
            --border-color: #2e323a;
            --text-main: #e2e4e9;
            --text-muted: #8b92a5;
            --accent: #5b7cff;
            --accent-hover: #4564df;
            --accent-green: #3ecf8e;
            --danger: #ff5b5b;
            --font-ui: system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            line-height: 1.5;
        }

        #app-container { display: flex; width: 100%; height: 100%; }

        /* ── Sidebar ── */
        #sidebar {
            width: 300px;
            min-width: 220px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        #sidebar-header {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #sidebar-header h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #sidebar-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* Search box */
        #sidebar-search {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        #sidebar-search input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.8rem;
            font-family: var(--font-ui);
            padding: 0.35rem 0.6rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #sidebar-search input:focus { border-color: var(--accent); }
        #sidebar-search input::placeholder { color: var(--text-muted); }

        #file-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        /* Loading / status row */
        .status-row {
            padding: 0.9rem 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.12);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .file-item {
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background-color 0.15s;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .file-item:hover { background-color: var(--bg-panel-hover); }
        .file-item.active {
            background-color: var(--bg-panel-hover);
            border-left: 3px solid var(--accent);
            padding-left: calc(1rem - 3px);
        }
        .file-item.error-item { opacity: 0.45; cursor: default; }
        .file-item.error-item:hover { background: none; }

        .file-name {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-tag {
            font-size: 0.68rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }
        .tag-badge {
            display: inline-block;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            padding: 0 4px;
            font-size: 0.65rem;
            letter-spacing: 0.02em;
        }
        .tag-badge.ok   { color: var(--accent-green); background: rgba(62,207,142,0.1); }
        .tag-badge.warn { color: #fbbf24; background: rgba(251,191,36,0.1); }
        .tag-badge.err  { color: var(--danger); background: rgba(255,91,91,0.1); }

        /* ── Main ── */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            overflow: hidden;
        }

        #top-bar {
            padding: 0.55rem 1rem;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        #current-file-name {
            font-size: 0.85rem;
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
        }
        #current-file-name.loaded { color: var(--text-main); }

        .btn {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.7rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.78rem;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }
        .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); }

        /* Placeholder when nothing selected */
        #placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 0.5rem;
            font-size: 0.88rem;
        }
        #placeholder svg { opacity: 0.25; }
        #placeholder.hidden { display: none; }

        /* Text viewer */
        #text-pane {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #text-pane.hidden { display: none; }

        #text-viewer {
            flex: 1;
            overflow: auto;
            padding: 1rem 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.7;
            white-space: pre;
            background-color: var(--bg-base);
            color: var(--text-main);
        }

        /* Loading overlay on text area */
        #loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-base);
            z-index: 5;
        }
        #loading-overlay.hidden { display: none; }
        #text-area-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Truncation notice */
        #truncation-notice {
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            color: #fbbf24;
            background: rgba(251,191,36,0.06);
            border-top: 1px solid rgba(251,191,36,0.15);
            display: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- Sidebar -->
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>CeIn₃ · AiiDA QE Output</h1>
            <div id="sidebar-meta">Loading files…</div>
        </div>
        <div id="sidebar-search">
            <input type="text" id="file-search" placeholder="Filter files…" autocomplete="off">
        </div>
        <ul id="file-list">
            <li class="status-row"><span class="spinner"></span> Fetching output files…</li>
        </ul>
    </div>

    <!-- Main -->
    <div id="main-content">
        <div id="top-bar">
            <div id="current-file-name">Select a file from the sidebar</div>
            <button class="btn" id="btn-raw" title="Open raw file in new tab" style="display:none">Raw ↗</button>
        </div>

        <!-- Placeholder -->
        <div id="placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Select a file to view its contents</span>
        </div>

        <!-- Text area -->
        <div id="text-pane" class="hidden">
            <div id="text-area-wrap">
                <div id="loading-overlay">
                    <span class="spinner" style="width:20px;height:20px;border-width:3px;"></span>
                </div>
                <div id="text-viewer"></div>
            </div>
            <div id="truncation-notice">⚠ File truncated at 2 MB for browser performance. Use "Raw ↗" to open the full file.</div>
        </div>
    </div>

</div>

<script>
/**
 * Known .out files in this directory.
 * Fetched automatically — no folder picker required.
 */
const OUT_FILES = [
    'PK8973_round1_cg.out',
    'PK9000_round2_cg_beta002.out',
    'PK9032_round3_baseline_cutoffs50-400.out',
    'PK9693_round4_combined.out',
    'PK9702_round5A_mixing_plain.out',
    'PK9706_round5B_ndim20.out',
    'PK9710_round5C_diago_full_acc.out',
    'PK9714_round5D_degauss005.out',
    'PK9718_round5E_magmom07.out',
    'PK9761_round6_5Aplus5E.out',
    'PK9767_round7A_startingwfc_atomicrandom.out',
    'PK9772_round7B_magmom09.out',
    'PK9777_round7C_magmom03.out',
    'PK9782_round7D_beta03_plain.out',
    'PK9787_round7E_beta015_plain.out',
    'PK9792_round7F_mixing_TF.out',
    'PK9802_round7H_diag_rmmdavidson.out',
    'PK9807_round7I_ndim20_plain.out',
    'PK9812_round7J_ueff4.0.out',
    'PK9817_round7K_ueff6.0.out',
    'PK9822_round7L_startingwfc_random.out',
    'PK9827_round7M_kpoints2x1x1.out',
    'PK9864_diagnostic_U0.out',
    'PK9870_diagnostic_4fincore_plusHubbard_REJECTED.out',
    'PK9876_diagnostic_4fincore_noU_REJECTED.out',
    'PK9945_round8_7Bplus7Dplus7K.out',
];

const TRUNCATE_BYTES = 2 * 1024 * 1024; // 2 MB display cap

// ── State ──────────────────────────────────────────────────────────────────
const state = {
    files: [],           // [{name, url, status, size}]
    selected: null,
    cache: new Map(),    // name → text content
};

// ── DOM refs ───────────────────────────────────────────────────────────────
const fileListEl        = document.getElementById('file-list');
const sidebarMeta       = document.getElementById('sidebar-meta');
const fileSearchEl      = document.getElementById('file-search');
const currentFileNameEl = document.getElementById('current-file-name');
const placeholder       = document.getElementById('placeholder');
const textPane          = document.getElementById('text-pane');
const textViewer        = document.getElementById('text-viewer');
const loadingOverlay    = document.getElementById('loading-overlay');
const truncationNotice  = document.getElementById('truncation-notice');
const btnRaw            = document.getElementById('btn-raw');

// ── Boot ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', init);

async function init() {
    // Build file descriptors with relative URLs
    state.files = OUT_FILES.map(name => ({
        name,
        url: name,   // same directory — relative URL works perfectly
        status: 'pending', // pending | ok | error
        size: null,
    }));

    renderFileList(state.files);
    sidebarMeta.textContent = `${state.files.length} files · click to open`;

    // Probe file availability (HEAD requests in parallel)
    await probeFiles();
}

async function probeFiles() {
    const checks = state.files.map(async f => {
        try {
            const r = await fetch(f.url, { method: 'HEAD' });
            f.status = r.ok ? 'ok' : 'error';
            const cl = r.headers.get('content-length');
            if (cl) f.size = parseInt(cl, 10);
        } catch {
            f.status = 'error';
        }
    });
    await Promise.all(checks);

    const ok  = state.files.filter(f => f.status === 'ok').length;
    const err = state.files.filter(f => f.status === 'error').length;
    sidebarMeta.textContent = `${ok} files available${err ? ` · ${err} unavailable` : ''}`;
    renderFileList(state.files);
}

// ── Render sidebar ─────────────────────────────────────────────────────────
function renderFileList(files) {
    const query = (fileSearchEl.value || '').toLowerCase().trim();
    const filtered = query ? files.filter(f => f.name.toLowerCase().includes(query)) : files;

    fileListEl.innerHTML = '';

    if (filtered.length === 0) {
        fileListEl.innerHTML = '<li class="status-row" style="color:var(--text-muted)">No matching files</li>';
        return;
    }

    filtered.forEach(f => {
        const li = document.createElement('li');
        li.className = 'file-item' +
            (f === state.selected ? ' active' : '') +
            (f.status === 'error' ? ' error-item' : '');

        // Parse label from filename
        const label = parseLabel(f.name);
        const badgeClass = f.status === 'ok' ? 'ok' : f.status === 'error' ? 'err' : '';
        const badgeText  = f.status === 'ok' ? '✓' : f.status === 'error' ? '✗ unavailable' : '…';
        const sizeStr    = f.size ? formatBytes(f.size) : '';
        const isRejected = f.name.includes('REJECTED');

        li.innerHTML = `
            <span class="file-name" title="${f.name}">${f.name}</span>
            <span class="file-tag">
                ${badgeClass ? `<span class="tag-badge ${badgeClass}">${badgeText}</span>` : ''}
                ${isRejected ? '<span class="tag-badge warn">REJECTED</span>' : ''}
                ${label ? `<span style="color:var(--text-muted)">${label}</span>` : ''}
                ${sizeStr ? `<span style="margin-left:auto;color:var(--text-muted)">${sizeStr}</span>` : ''}
            </span>`;

        if (f.status !== 'error') {
            li.addEventListener('click', () => selectFile(f));
        }
        fileListEl.appendChild(li);
    });
}

// Extract a human label from the filename (round, variant, etc.)
function parseLabel(name) {
    // e.g. PK9702_round5A_mixing_plain → "round5A · mixing plain"
    const m = name.match(/round(\d+[A-Z]?)_(.+?)\.out$/i);
    if (m) return `round ${m[1]} · ${m[2].replace(/_/g,' ')}`;
    const d = name.match(/diagnostic_(.+?)\.out$/i);
    if (d) return `diagnostic · ${d[1].replace(/_/g,' ')}`;
    return '';
}

function formatBytes(b) {
    if (b >= 1e6) return (b/1e6).toFixed(1) + ' MB';
    if (b >= 1e3) return (b/1e3).toFixed(0) + ' KB';
    return b + ' B';
}

// ── File selection & loading ───────────────────────────────────────────────
async function selectFile(file) {
    if (state.selected === file) return;
    state.selected = file;
    currentFileNameEl.textContent = file.name;
    currentFileNameEl.classList.add('loaded');
    btnRaw.style.display = '';
    btnRaw.onclick = () => window.open(file.url, '_blank');

    // Switch to text pane
    placeholder.classList.add('hidden');
    textPane.classList.remove('hidden');
    loadingOverlay.classList.remove('hidden');
    textViewer.textContent = '';
    truncationNotice.style.display = 'none';

    renderFileList(state.files); // update active highlight

    // Load content (from cache or fetch)
    let text;
    if (state.cache.has(file.name)) {
        text = state.cache.get(file.name);
    } else {
        try {
            const resp = await fetch(file.url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const buf = await resp.arrayBuffer();
            const decoder = new TextDecoder('utf-8');
            if (buf.byteLength > TRUNCATE_BYTES) {
                text = decoder.decode(buf.slice(0, TRUNCATE_BYTES)) + '\n\n… [truncated]';
                truncationNotice.style.display = '';
            } else {
                text = decoder.decode(buf);
            }
        } catch (e) {
            text = `Error loading file:\n${e.message}`;
        }
        // Simple LRU: evict oldest if cache > 8 entries
        if (state.cache.size >= 8) {
            state.cache.delete(state.cache.keys().next().value);
        }
        state.cache.set(file.name, text);
    }

    textViewer.textContent = text;
    loadingOverlay.classList.add('hidden');
}

// ── Sidebar search ─────────────────────────────────────────────────────────
fileSearchEl.addEventListener('input', () => renderFileList(state.files));
</script>
</body>
</html>
